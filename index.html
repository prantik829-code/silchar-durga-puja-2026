<style>
  :root{
    --maroon: #6b0f1a;
    --maroon-dark: #3d070d;
    --red: #a3121f;
    --gold: #e6b84f;
    --gold-light: #f5dfa0;
    --cream: #fff3d6;
    --card-bg: rgba(255, 243, 214, 0.06);
    --card-border: rgba(230, 184, 79, 0.35);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: 'Georgia', 'Palatino Linotype', serif;
    background:
      radial-gradient(circle at 15% 10%, rgba(230,184,79,0.15), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(230,184,79,0.12), transparent 40%),
      linear-gradient(160deg, var(--maroon-dark) 0%, var(--maroon) 45%, var(--red) 100%);
    color: var(--cream);
    min-height: 100vh;
    padding-bottom: 40px;
  }
  .topbar{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 14px 16px 10px;
    border-bottom: 1px solid rgba(230,184,79,0.2);
  }
  .topbar img{
    width: 34px;
    height: 34px;
    border-radius: 8px;
    object-fit: cover;
  }
  .topbar span{
    font-family: Arial, sans-serif;
    font-size: 0.95rem;
    letter-spacing: 0.04em;
    color: var(--gold-light);
    font-weight: 700;
  }
  header{
    text-align:center;
    padding: 28px 16px 20px;
    position: relative;
  }
  .durga-art{
    width: 92px;
    height: 92px;
    margin: 0 auto 10px;
    display: block;
  }
  .diya-row{
    font-size: 22px;
    letter-spacing: 10px;
    opacity: 0.85;
    margin-bottom: 8px;
  }
  header h1{
    margin: 4px 0 4px;
    font-size: 2rem;
    color: var(--gold-light);
    text-shadow: 0 2px 10px rgba(0,0,0,0.4);
    letter-spacing: 0.5px;
  }
  header .bengali{
    font-size: 1.3rem;
    color: var(--gold);
    margin: 2px 0 10px;
  }
  header p.sub{
    color: var(--cream);
    opacity: 0.85;
    font-size: 0.95rem;
    max-width: 480px;
    margin: 0 auto;
  }
  .divider{
    width: 120px;
    height: 3px;
    margin: 18px auto 0;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }
  .search-wrap{
    max-width: 560px;
    margin: 22px auto 0;
    padding: 0 16px;
  }
  #searchBox{
    width: 100%;
    padding: 12px 16px;
    border-radius: 999px;
    border: 1px solid var(--card-border);
    background: rgba(0,0,0,0.25);
    color: var(--cream);
    font-size: 1rem;
    outline: none;
  }
  #searchBox::placeholder{ color: rgba(255,243,214,0.55); }
  main{
    max-width: 640px;
    margin: 0 auto;
    padding: 20px 16px 0;
  }
  .grid{
    display: grid;
    grid-template-columns: 1fr;
    gap: 14px;
  }
  @media(min-width: 640px){
    .grid{ grid-template-columns: 1fr 1fr; }
  }
  .card{
    background: linear-gradient(160deg, rgba(255,243,214,0.08), rgba(255,243,214,0.02));
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 16px 18px 14px;
    position: relative;
    overflow: hidden;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .card::before{
    content:"";
    position:absolute;
    top:0; left:0; right:0;
    height: 3px;
    background: linear-gradient(90deg, var(--gold), transparent 70%);
  }
  .card:active{ transform: scale(0.98); }
  .badge-row{
    display:flex;
    justify-content:flex-end;
    align-items:center;
    margin-bottom: 6px;
  }
  .num{
    background: rgba(0,0,0,0.35);
    color: var(--gold-light);
    font-size: 0.72rem;
    font-family: Arial, sans-serif;
    padding: 2px 9px;
    border-radius: 999px;
    border: 1px solid var(--card-border);
  }
  .card h3{
    margin: 2px 0 8px;
    font-size: 1.12rem;
    color: var(--gold-light);
    line-height: 1.3;
  }
  .loc{
    font-family: Arial, sans-serif;
    font-size: 0.85rem;
    margin-bottom: 3px;
  }
  .loc .area{ color: var(--gold); font-weight: 600; }
  .loc .city{ color: rgba(255,243,214,0.65); }
  .dir-btn{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 11px 0;
    border-radius: 999px;
    border: 1px solid var(--card-border);
    background: rgba(0,0,0,0.28);
    color: var(--gold-light);
    text-decoration: none;
    font-family: Arial, sans-serif;
    font-size: 0.92rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    flex: 1;
  }
  .dir-btn:hover{
    background: rgba(230,184,79,0.18);
    border-color: var(--gold);
  }
  .btn-row{
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }
  .share-btn{
    display: flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    flex: 0 0 44px;
    border-radius: 999px;
    border: 1px solid var(--card-border);
    background: rgba(0,0,0,0.28);
    color: var(--gold-light);
    font-size: 1rem;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .share-btn:hover{
    background: rgba(230,184,79,0.18);
    border-color: var(--gold);
  }
  .share-btn.copied{
    background: rgba(79,191,116,0.25);
    border-color: #4fbf74;
  }
  footer{
    text-align:center;
    margin-top: 40px;
    padding: 20px 16px 10px;
    color: rgba(255,243,214,0.6);
    font-family: Arial, sans-serif;
    font-size: 0.82rem;
  }
  footer .bengali-foot{
    color: var(--gold);
    font-size: 1.05rem;
    margin-top: 8px;
    font-family: Georgia, serif;
  }
  footer .credit{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 16px;
  }
  footer .credit img{
    width: 26px;
    height: 26px;
    border-radius: 6px;
    background: var(--gold);
    object-fit: cover;
  }
  footer .credit span{
    color: var(--gold-light);
    font-size: 0.85rem;
    letter-spacing: 0.02em;
  }
  footer .credit span b{
    color: var(--gold);
  }
  footer .credit-link{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    text-decoration: none;
  }
  footer .follow-badge{
    font-size: 0.78rem;
    color: rgba(255,243,214,0.55);
    border: 1px solid var(--card-border);
    padding: 3px 10px;
    border-radius: 999px;
  }
  footer .credit-link:hover .follow-badge{
    border-color: var(--gold);
    color: var(--gold-light);
  }
  .progress-pill{
    display: inline-block;
    margin-top: 8px;
    font-family: Arial, sans-serif;
    font-size: 0.78rem;
    color: var(--gold-light);
    background: rgba(0,0,0,0.28);
    border: 1px solid var(--card-border);
    padding: 5px 14px;
    border-radius: 999px;
  }
  .no-results{
    text-align:center;
    padding: 30px 10px;
    color: rgba(255,243,214,0.6);
    display:none;
  }
  .safety-section{
    max-width: 640px;
    margin: 34px auto 0;
    padding: 0 16px;
  }
  .safety-card{
    background: linear-gradient(160deg, rgba(255,243,214,0.07), rgba(255,243,214,0.02));
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 18px 18px 16px;
  }
  .safety-card h2{
    margin: 0 0 12px;
    font-size: 1.05rem;
    color: var(--gold-light);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .safety-grid{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 14px;
  }
  .safety-item{
    font-family: Arial, sans-serif;
    font-size: 0.82rem;
    color: rgba(255,243,214,0.85);
    background: rgba(0,0,0,0.22);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 10px 12px;
  }
  .safety-item b{
    display: block;
    color: var(--gold);
    font-size: 0.95rem;
    margin-bottom: 2px;
  }
  .safety-item a{
    color: inherit;
    text-decoration: none;
  }
  .correction-link{
    display: block;
    text-align: center;
    font-family: Arial, sans-serif;
    font-size: 0.82rem;
    color: var(--gold-light);
    text-decoration: none;
    border-top: 1px solid var(--card-border);
    padding-top: 12px;
    margin-top: 4px;
  }
  .correction-link:hover{ color: var(--gold); }
  .count-pill{
    text-align:center;
    font-family: Arial, sans-serif;
    font-size: 0.8rem;
    color: rgba(255,243,214,0.6);
    margin: 10px 0 0;
  }
  .visitor-counter{
    text-align:center;
    margin-top: 10px;
  }
  .visitor-counter img{
    height: 20px;
    border-radius: 4px;
    vertical-align: middle;
  }
  .visitor-counter .vc-fallback{
    display: none;
    font-family: Arial, sans-serif;
    font-size: 0.78rem;
    color: rgba(255,243,214,0.55);
  }
</style>
